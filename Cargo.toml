[package]
name = "convert3d"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Right-click convert any 3D file (or a zip of model + textures) to any other 3D format"
license = "MIT"
repository = "https://github.com/srlegrand/convert3d"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
walkdir = "2.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation"] }
winreg = "0.56.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
